<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동전 던지기에서 유전체 조립까지 | 사이언스 아카이브 포트폴리오</title>
<meta name="description" content="확률과 조합으로 본 무작위성의 구조 — 마르코프 체인, 리플 셔플, 램지 이론, 드 브루인 수열과 유전체 조립">

<!-- ═══════════════════════════════════════════════════════════════
     [이미지 안내]  저장소 구조를 아래처럼 만드세요.
       index.html
       project.html
       images/
         └ hero.jpg        ← 이 페이지의 배경 이미지 (권장 1920×1080 이상)
     배경 이미지 경로는 아래 :root 의 --hero-image 한 곳만 고치면 됩니다.
     이미지를 아직 안 넣었어도 남색 그라데이션으로 정상 표시됩니다.
     ═══════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
:root{
  /* ▼▼▼ 배경 이미지 경로 — 여기만 바꾸세요 ▼▼▼ */
  --hero-image: url('images/hero.jpg');
  /* ▲▲▲ 이미지가 없으면 아래 그라데이션만 보입니다 ▲▲▲ */

  --ink-900:#070B24;
  --ink-800:#0E1440;
  --ink-600:#1E2A6E;
  --violet:#2A1C5E;
  --accent:#A9C7FF;
  --accent-ink:#0B1236;
  --paper:#EEF1FA;
  --muted:rgba(238,241,250,.62);

  --font-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-sans);
  background:var(--ink-900);
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
}

/* ── 히어로 ───────────────────────────────────────────── */
.hero{
  position:relative;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:clamp(32px,6vw,80px) clamp(20px,5vw,64px);
  overflow:hidden;
  isolation:isolate;
}
/* 레이어 1: 배경 이미지 */
.hero::before{
  content:"";
  position:absolute; inset:0; z-index:-2;
  background-color:var(--ink-800);
  background-image:
    radial-gradient(120% 90% at 78% 12%, rgba(84,60,190,.55) 0%, transparent 58%),
    radial-gradient(100% 80% at 12% 88%, rgba(24,50,150,.55) 0%, transparent 60%),
    linear-gradient(155deg,#080C2B 0%,#141A52 45%,#2A1C5E 100%),
    var(--hero-image);
  background-size:cover,cover,cover,cover;
  background-position:center;
  background-blend-mode:screen,screen,normal,normal;
}
/* 레이어 2: 가독성 확보용 어두운 비네트 */
.hero::after{
  content:"";
  position:absolute; inset:0; z-index:-1;
  background:
    linear-gradient(to bottom, rgba(6,9,32,.55) 0%, rgba(6,9,32,.30) 42%, rgba(6,9,32,.72) 100%),
    radial-gradient(78% 62% at 50% 46%, transparent 0%, rgba(6,9,32,.55) 100%);
}

.hero-inner{
  width:min(1180px,100%);
  text-align:center;
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}

.eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  font-size:clamp(11px,1.1vw,13px);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 clamp(20px,3vw,32px);
  padding:8px 16px;
  border:1px solid rgba(169,199,255,.28);
  border-radius:100px;
  background:rgba(169,199,255,.06);
  backdrop-filter:blur(6px);
}
.eyebrow .dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 12px var(--accent);
}

h1{
  margin:0;
  font-size:clamp(30px,6.2vw,80px);
  font-weight:800;
  line-height:1.18;
  letter-spacing:-.035em;
  word-break:keep-all;
  text-shadow:0 2px 40px rgba(6,9,32,.65);
}
h1 .line2{
  display:block;
  font-weight:500;
  font-size:.52em;
  letter-spacing:-.02em;
  color:var(--accent);
  margin-top:clamp(12px,1.6vw,20px);
}

.byline{
  margin:clamp(26px,4vw,40px) 0 0;
  font-size:clamp(14px,1.5vw,18px);
  color:var(--muted);
  letter-spacing:.01em;
}
.byline strong{ color:var(--paper); font-weight:600; }

.rule{
  width:52px;height:1px;margin:clamp(28px,4vw,44px) auto;
  background:linear-gradient(90deg,transparent,rgba(169,199,255,.7),transparent);
}

.cta{
  display:inline-block;
  padding:16px 40px;
  border-radius:14px;
  background:var(--accent);
  color:var(--accent-ink);
  font-size:clamp(15px,1.6vw,18px);
  font-weight:700;
  text-decoration:none;
  letter-spacing:-.01em;
  transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease, background .22s ease;
  box-shadow:0 10px 34px rgba(169,199,255,.24);
}
.cta:hover{ transform:translateY(-3px); background:#C4D9FF; box-shadow:0 16px 44px rgba(169,199,255,.36); }
.cta:active{ transform:translateY(-1px); }
.cta:focus-visible{ outline:3px solid #fff; outline-offset:4px; }

/* 하단 주제 태그 */
.topics{
  position:absolute;
  left:50%; bottom:clamp(20px,4vh,44px);
  transform:translateX(-50%);
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px 10px;
  width:min(880px,90vw);
  animation:rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both;
}
.topics span{
  font-size:clamp(10px,1.1vw,12.5px);
  letter-spacing:.06em;
  color:rgba(238,241,250,.55);
  border:1px solid rgba(238,241,250,.16);
  border-radius:100px;
  padding:6px 13px;
  white-space:nowrap;
}

@keyframes rise{ from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:none;} }
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important;}
  html{scroll-behavior:auto;}
}
@media (max-width:640px){
  .topics{ display:none; }
  .hero{ min-height:92svh; }
}
</style>
</head>
<body>

<main class="hero">
  <div class="hero-inner">

    <p class="eyebrow"><span class="dot"></span>Probability &amp; Combinatorics</p>

    <!-- ▼ 제목: 원하는 문구로 바꾸세요 ▼ -->
    <h1>
      동전 던지기에서 유전체 조립까지
      <span class="line2">확률과 조합으로 본 무작위성의 구조</span>
    </h1>

    <p class="byline">사이언스 아카이브 포트폴리오 &nbsp;·&nbsp; <strong>10826 정연우</strong></p>

    <div class="rule"></div>

    <a class="cta" href="project.html">프로젝트 보기</a>
  </div>

  <div class="topics">
    <span>큰 수의 법칙</span>
    <span>마르코프 체인</span>
    <span>전이행렬</span>
    <span>리플 셔플</span>
    <span>다이아코니스 정리</span>
    <span>램지 이론</span>
    <span>드 브루인 수열</span>
    <span>오일러 회로</span>
    <span>유전체 조립</span>
  </div>
</main>

</body>
</html>
